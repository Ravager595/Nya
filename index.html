<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti, mi linda vampira 🦇🩸</title>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --negro: #08040d;
    --blanco: #f5f0f2;
    --tallo-1: #2f5c3c;
    --tallo-2: #4c8a58;
    --semilla: #6b4a34;
    --rosa-claro: #ffd9e6;
    --rosa-medio: #ff9dc0;
    --rosa-fuerte: #ef6f9c;
    --rosa-sombra: #b8497a;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--negro);
    background-image: 
      radial-gradient(circle at 50% 30%, rgba(45, 15, 55, 0.5) 0%, transparent 70%),
      radial-gradient(circle at 80% 80%, rgba(20, 8, 30, 0.8) 0%, transparent 50%);
    background-attachment: fixed;
    color: var(--blanco);
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    font-family: "Cormorant Garamond", serif;
    overflow: hidden;
    padding: 24px;
    position: relative;
  }

  /* Textura de fondo sutil */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      135deg,
      rgba(255,255,255,0.015) 0px,
      rgba(255,255,255,0.015) 1px,
      transparent 1px,
      transparent 7px
    );
    pointer-events: none;
    z-index: 1;
  }

  /* HAZ DE LUZ ENTRANDO POR LA VENTANA */
  .luz-ventana {
    position: fixed;
    top: -20%;
    left: -10%;
    width: 75vw;
    height: 140vh;
    background: linear-gradient(
      115deg,
      rgba(255, 235, 210, 0.22) 0%,
      rgba(215, 170, 235, 0.12) 30%,
      rgba(140, 80, 160, 0.03) 70%,
      transparent 100%
    );
    transform: rotate(-12deg);
    pointer-events: none;
    z-index: 2;
    filter: blur(18px);
    mix-blend-mode: screen;
    animation: respirarLuz 7s ease-in-out infinite alternate;
  }

  @keyframes respirarLuz {
    0% { opacity: 0.75; filter: blur(18px); }
    100% { opacity: 1; filter: blur(14px); }
  }

  /* 6 Cruces Góticas */
  .cruz-gotica {
    position: fixed;
    pointer-events: none;
    z-index: 4;
    filter: drop-shadow(0 0 14px rgba(220, 38, 38, 0.8));
    opacity: 0.85;
  }

  /* 8 Corazones Sangrantes */
  .corazon-sangre {
    position: fixed;
    pointer-events: none;
    z-index: 5;
    filter: drop-shadow(0 0 12px #ff0033);
    animation: latido 2.4s infinite ease-in-out;
  }

  @keyframes latido {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  .cielo {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 3;
  }

  /* Puntitos parpadeando */
  .estrella {
    position: absolute;
    background: #ffffff;
    border-radius: 50%;
    animation: parpadeo 3.2s ease-in-out infinite;
  }

  @keyframes parpadeo {
    0%, 100% { opacity: 0.2; transform: scale(0.8); }
    50% { opacity: 0.9; transform: scale(1.3); }
  }

  /* Polvo flotante iluminado */
  .mota-polvo {
    position: absolute;
    background: rgba(255, 245, 225, 0.85);
    border-radius: 50%;
    box-shadow: 0 0 6px rgba(255, 230, 190, 0.8);
    pointer-events: none;
    animation: flotarPolvo linear infinite;
  }

  @keyframes flotarPolvo {
    0% {
      transform: translateY(0) translateX(0) scale(0.8);
      opacity: 0;
    }
    20% {
      opacity: 0.9;
    }
    80% {
      opacity: 0.8;
    }
    100% {
      transform: translateY(-110px) translateX(35px) scale(1.2);
      opacity: 0;
    }
  }

  .escena {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    max-width: 640px;
    position: relative;
    z-index: 10;
  }

  h1 {
    font-family: "UnifrakturCook", serif;
    font-size: 56px;
    margin: 0;
    letter-spacing: 1px;
    text-shadow: 0 0 22px rgba(220, 100, 240, 0.8);
  }

  p.intro {
    font-size: 24px;
    margin: 0;
    color: #e7dde3;
    text-shadow: 0 0 8px rgba(180, 80, 220, 0.6);
  }

  button {
    font-family: "UnifrakturCook", serif;
    font-size: 21px;
    padding: 12px 28px;
    background-color: rgba(5, 3, 8, 0.8);
    color: var(--blanco);
    border: 2px solid var(--blanco);
    border-radius: 8px;
    cursor: pointer;
    transition: 0.35s;
    letter-spacing: 1px;
    backdrop-filter: blur(6px);
  }
  button:hover {
    background-color: var(--blanco);
    color: var(--negro);
    box-shadow: 0 0 25px rgba(210, 130, 255, 0.9);
  }

  .intro-grupo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    transition: opacity 0.9s ease, transform 0.9s ease;
  }
  .intro-grupo.oculto {
    opacity: 0;
    transform: translateY(-16px) scale(0.96);
    pointer-events: none;
    position: absolute;
  }

  .jardin-wrap {
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  .jardin-wrap.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .ramo {
    width: min(78vw, 320px);
    height: auto;
    overflow: visible;
  }

  .semilla {
    opacity: 0;
    transform: scale(0);
    transform-origin: 0 0;
    transition: opacity 0.5s ease, transform 0.5s cubic-bezier(.34,1.56,.64,1);
  }
  .semilla.on { opacity: 1; transform: scale(1); }

  .tallo {
    fill: none;
    stroke-width: 6;
    stroke-linecap: round;
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    transition: stroke-dashoffset 1.3s ease-in-out;
  }
  .tallo.on { stroke-dashoffset: 0; }

  .hoja {
    opacity: 0;
    transform: scale(0.15);
    transform-origin: 0 0;
    transition: opacity 0.55s ease, transform 0.55s cubic-bezier(.34,1.56,.64,1);
  }
  .hoja.on { opacity: 1; transform: scale(1); }

  .capullo {
    opacity: 0;
    transform: scale(0.1) translateY(6px);
    transform-origin: 0 0;
    transition: opacity 0.7s ease, transform 0.9s cubic-bezier(.34,1.56,.64,1);
  }
  .capullo.on {
    opacity: 1;
    transform: scale(1) translateY(0);
  }

  .petalo-sombra { fill: var(--rosa-sombra); opacity: 0.5; }

  .final {
    font-size: 24px;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 1s ease, transform 1s ease;
    max-width: 520px;
    position: relative;
    z-index: 10;
    text-shadow: 0 0 10px rgba(200, 100, 240, 0.7);
  }
  .final.on { opacity: 1; transform: translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; animation: none !important; }
  }

  @media (max-width: 520px) {
    h1 { font-size: 42px; }
  }
</style>

<script>
  const cielo = document.getElementById('cielo');

  // Puntitos parpadeando (Estrellas)
  for (let i = 0; i < 65; i++) {
    const e = document.createElement('div');
    e.className = 'estrella';
    const s = Math.random() * 2.5 + 1;
    e.style.width = s + 'px';
    e.style.height = s + 'px';
    e.style.top = Math.random() * 100 + '%';
    e.style.left = Math.random() * 100 + '%';
    e.style.animationDelay = (Math.random() * 3.5) + 's';
    cielo.appendChild(e);
  }

  // Polvo flotante iluminado por la luz de la ventana
  for (let i = 0; i < 45; i++) {
    const polvo = document.createElement('div');
    polvo.className = 'mota-polvo';
    const size = Math.random() * 3 + 1.2;
    polvo.style.width = size + 'px';
    polvo.style.height = size + 'px';
    polvo.style.top = (Math.random() * 90) + '%';
    polvo.style.left = (Math.random() * 85) + '%';
    polvo.style.animationDuration = (Math.random() * 10 + 7) + 's';
    polvo.style.animationDelay = (Math.random() * 5) + 's';
    cielo.appendChild(polvo);
  }

  // Crecimiento de los Tulipanes
  const esperar = (ms) => new Promise(r => setTimeout(r, ms));

  async function crecerTulipan(sufijo, retrasoInicial) {
    await esperar(retrasoInicial);
    document.getElementById(`semilla-${sufijo}`).classList.add('on');
    await esperar(600);
    document.getElementById(`semilla-${sufijo}`).style.opacity = 0;
    document.getElementById(`tallo-${sufijo}`).classList.add('on');
    await esperar(1200);
    document.getElementById(`hoja1-${sufijo}`).classList.add('on');
    await esperar(450);
    document.getElementById(`hoja2-${sufijo}`).classList.add('on');
    await esperar(550);
    document.getElementById(`capullo-${sufijo}`).classList.add('on');
  }

  document.getElementById('botonInicio').addEventListener('click', async () => {
    document.getElementById('introGrupo').classList.add('oculto');
    await esperar(700);
    document.getElementById('jardinWrap').classList.add('visible');

    await Promise.all([
      crecerTulipan('centro', 0),
      crecerTulipan('izq', 300),
      crecerTulipan('der', 450)
    ]);

    await esperar(500);
    document.getElementById('mensajeFinal').classList.add('on');
  });
</script>
</body>
</html>
