<style>
  .slider-container {
    width: 100%;
    max-width: 500px;
    overflow: hidden;
    position: relative;
    margin: 0 auto;
    border-radius: 12px;
  }

  .slider-track {
    display: flex;
    width: 200%;
    transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
  }

  .slide {
    width: 50%;
    box-sizing: border-box;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
  }

  .arrow-btn {
    background: none;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
    padding: 8px;
    transition: transform 0.2s ease;
  }

  .arrow-btn:hover {
    transform: scale(1.2);
  }
</style>

<div class="slider-container">
  <div class="slider-track" id="sliderTrack">
    
    <div class="slide">
      <p class="texto">
        Hola, mi niña. "Esta página es algo muy íntimo y que me llena de nervios, ya que es algo nuevo y algo que jamás pensé hacerle a alguien y espero poder hacerte mil y un regalos más impactantes que este 🖤"
      </p>
      <button class="arrow-btn" onclick="nextSlide()" aria-label="Siguiente">➔</button>
    </div>

    <div class="slide">
      <button class="arrow-btn" onclick="prevSlide()" aria-label="Anterior">⬅</button>
      <p class="texto">
        &lt;texto&gt;
      </p>
    </div>

  </div>
</div>

<script>
  const track = document.getElementById('sliderTrack');

  function nextSlide() {
    track.style.transform = 'translateX(-50%)';
  }

  function prevSlide() {
    track.style.transform = 'translateX(0%)';
  }
</script>
