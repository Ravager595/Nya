<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para ti, mi linda vampira 🦇🩸</title>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --negro: #030106;
    --blanco: #f5f0f2;
    --tallo-1: #2f5c3c;
    --tallo-2: #4c8a58;
    --semilla: #6b4a34;
    --rosa-claro: #ffd9e6;
    --rosa-medio: #ff9dc0;
    --rosa-fuerte: #ef6f9c;
    --rosa-sombra: #b8497a;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    background: 
      radial-gradient(circle at 50% 20%, rgba(192, 38, 211, 0.35) 0%, transparent 45%),
      radial-gradient(circle at 25% 70%, rgba(147, 51, 234, 0.25) 0%, transparent 40%),
      radial-gradient(circle at 75% 65%, rgba(219, 39, 119, 0.2) 0%, transparent 45%),
      radial-gradient(ellipse at 50% 25%, #2d0b3f 0%, #13051c 50%, var(--negro) 85%);
    background-attachment: fixed;
    color: var(--blanco);
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    font-family: "Cormorant Garamond", serif;
    overflow: hidden;
    padding: 24px;
    position: relative;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      135deg,
      rgba(255,255,255,0.025) 0px,
      rgba(255,255,255,0.025) 1px,
      transparent 1px,
      transparent 7px
    );
    pointer-events: none;
    z-index: 1;
  }

  /* Canvas del Muro de Fuego en la mitad inferior */
  #canvasFuego {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 50vh;
    pointer-events: none;
    z-index: 2;
    mix-blend-mode: screen;
  }

  /* 6 Cruces Góticas */
  .cruz-gotica {
    position: fixed;
    pointer-events: none;
    z-index: 4;
    filter: drop-shadow(0 0 14px rgba(220, 38, 38, 0.8));
    opacity: 0.85;
  }

  /* 8 Corazones Sangrantes con Z-Index elevado */
  .corazon-sangre {
    position: fixed;
    pointer-events: none;
    z-index: 5;
    filter: drop-shadow(0 0 12px #ff0033);
    animation: latido 2.4s infinite ease-in-out;
  }

  @keyframes latido {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  .cielo {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 1;
  }
  .estrella {
    position: absolute;
    background: #ffffff;
    border-radius: 50%;
    animation: parpadeo 3.2s ease-in-out infinite;
  }
  .luciernaga {
    position: absolute;
    background: #ffe9a8;
    border-radius: 50%;
    box-shadow: 0 0 8px 3px rgba(230, 160, 255, 0.7);
    animation: flotar 6s ease-in-out infinite;
  }
  @keyframes parpadeo {
    0%, 100% { opacity: 0.25; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.2); }
  }
  @keyframes flotar {
    0%, 100% { transform: translateY(0) translateX(0); opacity: 0.5; }
    50% { transform: translateY(-10px) translateX(4px); opacity: 1; }
  }

  .escena {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    max-width: 640px;
    position: relative;
    z-index: 10;
  }

  h1 {
    font-family: "UnifrakturCook", serif;
    font-size: 56px;
    margin: 0;
    letter-spacing: 1px;
    text-shadow: 0 0 22px rgba(220, 100, 240, 0.8);
  }

  p.intro {
    font-size: 24px;
    margin: 0;
    color: #e7dde3;
    text-shadow: 0 0 8px rgba(180, 80, 220, 0.6);
  }

  button {
    font-family: "UnifrakturCook", serif;
    font-size: 21px;
    padding: 12px 28px;
    background-color: rgba(5, 3, 8, 0.8);
    color: var(--blanco);
    border: 2px solid var(--blanco);
    border-radius: 8px;
    cursor: pointer;
    transition: 0.35s;
    letter-spacing: 1px;
    backdrop-filter: blur(6px);
  }
  button:hover {
    background-color: var(--blanco);
    color: var(--negro);
    box-shadow: 0 0 25px rgba(210, 130, 255, 0.9);
  }

  .intro-grupo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    transition: opacity 0.9s ease, transform 0.9s ease;
  }
  .intro-grupo.oculto {
    opacity: 0;
    transform: translateY(-16px) scale(0.96);
    pointer-events: none;
    position: absolute;
  }

  .jardin-wrap {
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  .jardin-wrap.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .ramo {
    width: min(78vw, 320px);
    height: auto;
    overflow: visible;
  }

  .semilla {
    opacity: 0;
    transform: scale(0);
    transform-origin: 0 0;
    transition: opacity 0.5s ease, transform 0.5s cubic-bezier(.34,1.56,.64,1);
  }
  .semilla.on { opacity: 1; transform: scale(1); }

  .tallo {
    fill: none;
    stroke-width: 6;
    stroke-linecap: round;
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    transition: stroke-dashoffset 1.3s ease-in-out;
  }
  .tallo.on { stroke-dashoffset: 0; }

  .hoja {
    opacity: 0;
    transform: scale(0.15);
    transform-origin: 0 0;
    transition: opacity 0.55s ease, transform 0.55s cubic-bezier(.34,1.56,.64,1);
  }
  .hoja.on { opacity: 1; transform: scale(1); }

  .capullo {
    opacity: 0;
    transform: scale(0.1) translateY(6px);
    transform-origin: 0 0;
    transition: opacity 0.7s ease, transform 0.9s cubic-bezier(.34,1.56,.64,1);
  }
  .capullo.on {
    opacity: 1;
    transform: scale(1) translateY(0);
  }

  .petalo-sombra { fill: var(--rosa-sombra); opacity: 0.5; }

  .final {
    font-size: 24px;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 1s ease, transform 1s ease;
    max-width: 520px;
    position: relative;
    z-index: 10;
    text-shadow: 0 0 10px rgba(200, 100, 240, 0.7);
  }
  .final.on { opacity: 1; transform: translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; animation: none !important; }
  }

  @media (max-width: 520px) {
    h1 { font-size: 42px; }
  }
</style>

<script>
  // Estrellas y Luciérnagas
  const cielo = document.getElementById('cielo');
  for (let i = 0; i < 65; i++) {
    const e = document.createElement('div');
    e.className = 'estrella';
    const s = Math.random() * 2.5 + 1;
    e.style.width = s + 'px';
    e.style.height = s + 'px';
    e.style.top = Math.random() * 100 + '%';
    e.style.left = Math.random() * 100 + '%';
    e.style.animationDelay = (Math.random() * 3) + 's';
    cielo.appendChild(e);
  }
  for (let i = 0; i < 7; i++) {
    const f = document.createElement('div');
    f.className = 'luciernaga';
    const s = Math.random() * 3.5 + 3;
    f.style.width = s + 'px';
    f.style.height = s + 'px';
    f.style.top = (20 + Math.random() * 50) + '%';
    f.style.left = (15 + Math.random() * 70) + '%';
    f.style.animationDelay = (Math.random() * 4) + 's';
    cielo.appendChild(f);
  }

  // Muro de Fuego Vivo
  const canvasFuego = document.getElementById('canvasFuego');
  const ctxFuego = canvasFuego.getContext('2d');
  let width, height;

  function resizeFuego() {
    width = canvasFuego.width = window.innerWidth;
    height = canvasFuego.height = window.innerHeight * 0.50;
  }
  window.addEventListener('resize', resizeFuego);
  resizeFuego();

  class Llama {
    constructor() {
      this.reset();
    }
    reset() {
      this.x = Math.random() * width;
      this.y = height + Math.random() * 20;
      this.vx = (Math.random() - 0.5) * 1.8;
      this.vy = -(Math.random() * 3.5 + 2.2);
      this.size = Math.random() * 28 + 16;
      this.life = Math.random() * 0.6 + 0.4;
      this.maxLife = this.life;
    }
    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.life -= 0.014;
      this.size *= 0.958;
      if (this.life <= 0 || this.size < 2) {
        this.reset();
      }
    }
    draw() {
      const ratio = this.life / this.maxLife;
      ctxFuego.save();
      ctxFuego.globalCompositeOperation = 'lighter';
      const grad = ctxFuego.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
      grad.addColorStop(0, `rgba(255, 235, 140, ${ratio * 0.9})`);
      grad.addColorStop(0.25, `rgba(255, 110, 20, ${ratio * 0.75})`);
      grad.addColorStop(0.65, `rgba(220, 20, 60, ${ratio * 0.35})`);
      grad.addColorStop(1, `rgba(80, 0, 40, 0)`);
      
      ctxFuego.fillStyle = grad;
      ctxFuego.beginPath();
      ctxFuego.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctxFuego.fill();
      ctxFuego.restore();
    }
  }

  const particulasFuego = Array.from({ length: 260 }, () => new Llama());

  function animarFuego() {
    ctxFuego.clearRect(0, 0, width, height);
    particulasFuego.forEach(p => {
      p.update();
      p.draw();
    });
    requestAnimationFrame(animarFuego);
  }
  animarFuego();

  // Crecimiento de los Tulipanes
  const esperar = (ms) => new Promise(r => setTimeout(r, ms));

  async function crecerTulipan(sufijo, retrasoInicial) {
    await esperar(retrasoInicial);
    document.getElementById(`semilla-${sufijo}`).classList.add('on');
    await esperar(600);
    document.getElementById(`semilla-${sufijo}`).style.opacity = 0;
    document.getElementById(`tallo-${sufijo}`).classList.add('on');
    await esperar(1200);
    document.getElementById(`hoja1-${sufijo}`).classList.add('on');
    await esperar(450);
    document.getElementById(`hoja2-${sufijo}`).classList.add('on');
    await esperar(550);
    document.getElementById(`capullo-${sufijo}`).classList.add('on');
  }

  document.getElementById('botonInicio').addEventListener('click', async () => {
    document.getElementById('introGrupo').classList.add('oculto');
    await esperar(700);
    document.getElementById('jardinWrap').classList.add('visible');

    await Promise.all([
      crecerTulipan('centro', 0),
      crecerTulipan('izq', 300),
      crecerTulipan('der', 450)
    ]);

    await esperar(500);
    document.getElementById('mensajeFinal').classList.add('on');
  });
</script>
</body>
</html>
