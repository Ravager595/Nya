<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Para ti, mi linda vampira 🦇🩸</title>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --negro: #08040d;
    --blanco: #f5f0f2;
    --tallo-1: #2f5c3c;
    --tallo-2: #4c8a58;
    --semilla: #6b4a34;
    --rosa-claro: #ffd9e6;
    --rosa-medio: #ff9dc0;
    --rosa-fuerte: #ef6f9c;
    --rosa-sombra: #b8497a;
    --pelaje-murcielago: #4a3728;
  }

  * { box-sizing: border-box; }

  html, body { 
    height: 100%; 
    width: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
  }

  body {
    min-height: 100dvh;
    background-color: var(--negro);
    background-image: 
      radial-gradient(circle at 50% 30%, rgba(45, 15, 55, 0.5) 0%, transparent 70%),
      radial-gradient(circle at 80% 80%, rgba(20, 8, 30, 0.8) 0%, transparent 50%);
    background-attachment: fixed;
    color: var(--blanco);
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    font-family: "Cormorant Garamond", serif;
    position: relative;
  }

  /* Textura de fondo sutil */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      135deg,
      rgba(255,255,255,0.015) 0px,
      rgba(255,255,255,0.015) 1px,
      transparent 1px,
      transparent 7px
    );
    pointer-events: none;
    z-index: 1;
  }

  /* HAZ DE LUZ ENTRANDO POR LA VENTANA */
  .luz-ventana {
    position: fixed;
    top: -20%;
    left: -20%;
    width: 100vw;
    height: 140dvh;
    background: linear-gradient(
      115deg,
      rgba(255, 235, 210, 0.22) 0%,
      rgba(215, 170, 235, 0.12) 30%,
      rgba(140, 80, 160, 0.03) 70%,
      transparent 100%
    );
    transform: rotate(-12deg);
    pointer-events: none;
    z-index: 2;
    filter: blur(18px);
    mix-blend-mode: screen;
    animation: respirarLuz 7s ease-in-out infinite alternate;
  }

  @keyframes respirarLuz {
    0% { opacity: 0.75; filter: blur(18px); }
    100% { opacity: 1; filter: blur(14px); }
  }

  /* LUNA EN ECLIPSE LUNAR PARCIALMENTE ROJA */
  .luna-eclipse {
    position: fixed;
    top: 14%;
    left: 50%;
    transform: translate(-50%, -20%) scale(0.7);
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff2db 0%, #e6a57e 30%, #991b1b 70%, #450a0a 100%);
    box-shadow: 
      0 0 25px rgba(239, 68, 68, 0.7),
      0 0 55px rgba(185, 28, 28, 0.4),
      inset -20px -10px 30px rgba(15, 3, 25, 0.85);
    opacity: 0;
    z-index: 6;
    pointer-events: none;
    transition: opacity 2s ease, transform 2.2s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .luna-eclipse.on {
    opacity: 1;
    transform: translate(-50%, 0) scale(1);
  }

  /* MURCIÉLAGOS */
  .murcielago {
    position: fixed;
    z-index: 7;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.2s ease, transform 1.2s ease;
  }

  .murcielago svg {
    fill: var(--pelaje-murcielago);
    filter: drop-shadow(0 0 6px rgba(0, 0, 0, 0.9));
    animation: aleteo 1.6s ease-in-out infinite alternate;
  }

  .murcielago.bat1 { top: 12%; left: 20%; transform: scale(0.5) rotate(-12deg); }
  .murcielago.bat2 { top: 9%; right: 18%; transform: scale(0.65) rotate(15deg); }
  .murcielago.bat3 { top: 22%; right: 26%; transform: scale(0.45) rotate(-8deg); }

  .murcielago.on {
    opacity: 0.9;
  }

  @keyframes aleteo {
    0% { transform: scaleY(1) translateY(0); }
    100% { transform: scaleY(0.65) translateY(-6px); }
  }

  /* Cruces Góticas */
  .cruz-gotica {
    position: fixed;
    pointer-events: none;
    z-index: 4;
    filter: drop-shadow(0 0 10px rgba(220, 38, 38, 0.8));
    opacity: 0.8;
  }

  /* Corazones Sangrantes */
  .corazon-sangre {
    position: fixed;
    pointer-events: none;
    z-index: 5;
    filter: drop-shadow(0 0 10px #ff0033);
    animation: latido 2.4s infinite ease-in-out;
  }

  @keyframes latido {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }

  .cielo {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 3;
  }

  .estrella {
    position: absolute;
    background: #ffffff;
    border-radius: 50%;
    animation: parpadeo 3.2s ease-in-out infinite;
  }

  @keyframes parpadeo {
    0%, 100% { opacity: 0.2; transform: scale(0.8); }
    50% { opacity: 0.9; transform: scale(1.3); }
  }

  .mota-polvo {
    position: absolute;
    background: rgba(255, 245, 225, 0.85);
    border-radius: 50%;
    box-shadow: 0 0 6px rgba(255, 230, 190, 0.8);
    pointer-events: none;
    animation: flotarPolvo linear infinite;
  }

  @keyframes flotarPolvo {
    0% {
      transform: translateY(0) translateX(0) scale(0.8);
      opacity: 0;
    }
    20% { opacity: 0.9; }
    80% { opacity: 0.8; }
    100% {
      transform: translateY(-110px) translateX(35px) scale(1.2);
      opacity: 0;
    }
  }

  /* CENTRADO ABSOLUTO DE BIENVENIDA Y BOTÓN */
  .intro-grupo {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    z-index: 30;
    transition: opacity 0.8s ease, transform 0.8s ease;
  }

  .intro-grupo.oculto {
    opacity: 0;
    transform: translate(-50%, -70%) scale(0.9);
    pointer-events: none;
  }

  h1 {
    font-family: "UnifrakturCook", serif;
    font-size: clamp(34px, 8.5vw, 46px);
    margin: 0;
    letter-spacing: 1px;
    line-height: 1.1;
    text-shadow: 0 0 18px rgba(220, 100, 240, 0.8);
  }

  p.intro {
    font-size: clamp(18px, 4.5vw, 22px);
    margin: 0;
    color: #e7dde3;
    text-shadow: 0 0 8px rgba(180, 80, 220, 0.6);
  }

  button {
    font-family: "UnifrakturCook", serif;
    font-size: 20px;
    padding: 12px 32px;
    background-color: rgba(5, 3, 8, 0.85);
    color: var(--blanco);
    border: 2px solid var(--blanco);
    border-radius: 8px;
    cursor: pointer;
    transition: 0.35s;
    letter-spacing: 1px;
    backdrop-filter: blur(6px);
    -webkit-tap-highlight-color: transparent;
  }
  button:active, button:hover {
    background-color: var(--blanco);
    color: var(--negro);
    box-shadow: 0 0 25px rgba(210, 130, 255, 0.9);
  }

  /* Contenedor Secundario (Flor e Historia) */
  .escena {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    width: 100%;
    max-width: 420px;
    height: 100dvh;
    position: relative;
    z-index: 10;
    padding: 16px;
  }

  .jardin-wrap {
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.8s ease, transform 0.8s ease;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .jardin-wrap.visible {
    opacity: 1;
    transform: translateY(0);
  }

  .ramo {
    width: min(72vw, 280px);
    max-height: 42dvh;
    height: auto;
    overflow: visible;
  }

  .cono-luz {
    opacity: 0;
    transform-origin: 150px 0px;
    transform: scaleY(0.2);
    transition: opacity 1.5s ease-out, transform 1.8s cubic-bezier(0.16, 1, 0.3, 1);
    mix-blend-mode: screen;
    filter: blur(4px);
    pointer-events: none;
  }
  .cono-luz.on {
    opacity: 1;
    transform: scaleY(1);
  }

  .semilla {
    opacity: 0;
    transform: scale(0);
    transform-origin: 0 0;
    transition: opacity 0.5s ease, transform 0.5s cubic-bezier(.34,1.56,.64,1);
  }
  .semilla.on { opacity: 1; transform: scale(1); }

  .tallo {
    fill: none;
    stroke-width: 6;
    stroke-linecap: round;
    stroke-dasharray: 1 1;
    stroke-dashoffset: 1;
    transition: stroke-dashoffset 1.3s ease-in-out;
  }
  .tallo.on { stroke-dashoffset: 0; }

  .hoja {
    opacity: 0;
    transform: scale(0.15);
    transform-origin: 0 0;
    transition: opacity 0.55s ease, transform 0.55s cubic-bezier(.34,1.56,.64,1);
  }
  .hoja.on { opacity: 1; transform: scale(1); }

  .capullo {
    opacity: 0;
    transform: scale(0.1) translateY(6px);
    transform-origin: 0 0;
    transition: opacity 0.7s ease, transform 0.9s cubic-bezier(.34,1.56,.64,1);
  }
  .capullo.on {
    opacity: 1;
    transform: scale(1) translateY(0);
  }

  .petalo-sombra { fill: var(--rosa-sombra); opacity: 0.5; }

  .final {
    font-size: clamp(18px, 4.5vw, 21px);
    line-height: 1.35;
    margin: 0;
    padding: 0 12px;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 1s ease, transform 1s ease;
    max-width: 360px;
    position: relative;
    z-index: 10;
    text-shadow: 0 0 10px rgba(200, 100, 240, 0.7);
  }
  .final.on { opacity: 1; transform: translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01ms !important; animation: none !important; }
  }
</style>
</head>

          <g transform="translate(204,255) rotate(135)"><ellipse class="hoja" id="hoja1-der" cx="0" cy="0" rx="15" ry="9" fill="var(--tallo-2)"/></g>

          <g transform="translate(208,128) rotate(18) scale(0.85)">

          <path class="tallo tallo-centro" id="tallo-centro" stroke="url(#gradTallo)" pathLength="1"
                d="M150,360 C150,320 148,285 150,245 C153,205 147,170 150,135 C152,105 150,78 150,55" />
          <g transform="translate(150,210) rotate(-160)"><ellipse class="hoja" id="hoja1-centro" cx="0" cy="0" rx="17" ry="10" fill="var(--tallo-1)"/></g>
          <g transform="translate(150,165) rotate(-20)"><ellipse class="hoja" id="hoja2-centro" cx="0" cy="0" rx="17" ry="10" fill="var(--tallo-2)"/></g>

            <g class="capullo" id="capullo-centro" filter="url(#brillo)">
              <path class="petalo-sombra" d="M0,4 C-18,0 -25,-27 -11,-52 C-6,-61 6,-61 11,-52 C25,-27 18,0 0,4 Z"/>

    <p class="final" id="mensajeFinal">
      Gracias por este maravilloso mes juntos. Me hubiera encantado darte flores físicas,
      pero en su lugar hice esto solo para ti, mi linda vampira. 🌷🦇
    </p>
  </div>

<script>
  const cielo = document.getElementById('cielo');

  for (let i = 0; i < 55; i++) {
    const e = document.createElement('div');
    e.className = 'estrella';
    const s = Math.random() * 2.2 + 1;
    e.style.width = s + 'px';
    e.style.height = s + 'px';
    e.style.top = Math.random() * 100 + '%';
    e.style.left = Math.random() * 100 + '%';
    e.style.animationDelay = (Math.random() * 3.5) + 's';
    cielo.appendChild(e);
  }

  for (let i = 0; i < 35; i++) {
    const polvo = document.createElement('div');
    polvo.className = 'mota-polvo';
    const size = Math.random() * 2.5 + 1.2;
    polvo.style.width = size + 'px';
    polvo.style.height = size + 'px';
    polvo.style.top = (Math.random() * 90) + '%';
    polvo.style.left = (Math.random() * 85) + '%';
    polvo.style.animationDuration = (Math.random() * 10 + 7) + 's';
    polvo.style.animationDelay = (Math.random() * 5) + 's';
    cielo.appendChild(polvo);
  }

  const esperar = (ms) => new Promise(r => setTimeout(r, ms));

  async function crecerTulipan(sufijo, retrasoInicial) {
    await esperar(retrasoInicial);
    const semilla = document.getElementById(`semilla-${sufijo}`);
    semilla.classList.add('on');
    await esperar(500);
    semilla.style.opacity = '0';
    document.getElementById(`tallo-${sufijo}`).classList.add('on');
    await esperar(1200);
    document.getElementById(`hoja1-${sufijo}`).classList.add('on');
    await esperar(450);
    document.getElementById(`hoja2-${sufijo}`).classList.add('on');
    await esperar(550);
    document.getElementById(`capullo-${sufijo}`).classList.add('on');
  }

  document.getElementById('botonInicio').addEventListener('click', async () => {
    document.getElementById('introGrupo').classList.add('oculto');
    await esperar(700);
    document.getElementById('jardinWrap').classList.add('visible');

    const crecimiento = Promise.all([
      crecerTulipan('centro', 0),
      crecerTulipan('izq', 300),
      crecerTulipan('der', 450)
    ]);

    await esperar(400);
    document.getElementById('conoLuz').classList.add('on');

    // Esperar a que las flores broten completamente
    await crecimiento;

    // 1. Desaparecer el cono de luz
    await esperar(300);
    document.getElementById('conoLuz').classList.remove('on');

    // 2. Aparecer la Luna Llena en Eclipse Lunar
    await esperar(800);
    document.getElementById('lunaEclipse').classList.add('on');

    // 3. Aparecer los 3 Murciélagos
    await esperar(1200);
    document.getElementById('bat1').classList.add('on');
    await esperar(250);
    document.getElementById('bat2').classList.add('on');
    await esperar(250);
    document.getElementById('bat3').classList.add('on');

    // 4. Mostrar mensaje final
    await esperar(800);
    document.getElementById('mensajeFinal').classList.add('on');
  });
</script>
</body>
</html>
