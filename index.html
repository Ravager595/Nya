<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti, mi linda vampira 🦇</title>
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            min-height: 100vh;

            background-color: #000000;
            color: #ffffff;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
            font-family: "UnifrakturCook", serif;
        }
        .contenedor {
            display: flex;
            flex-direction: column;
            align-items: center;

            gap: 20px;
        }
        h1 {
            font-size: 60px;
            margin: 0;
        }
        p {
            font-size: 25px;
            margin: 0;
        }
        button {
            font-family: "UnifrakturCook", serif;
            font-size: 22px;
            padding: 12px 25px;
            background-color: #000000;
            color: #ffffff;
            border: 2px solid #ffffff;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }

        /* Efecto al pasar el mouse */
        button:hover {
            background-color: #ffffff;
            color: #000000;
        }

    </style>
</head>
<body>
    <div class="contenedor">
        <h1>Hola, mi vida 🦇🩸</h1>
        <p>
            Hice algo pequeño y con todo el corazón, para ti.
        </p>
        <button>
            Haz clic aquí
        </button>
    </div>
</body>

</html>
